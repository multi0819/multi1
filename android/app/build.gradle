plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
 namespace 'com.multi0819.travelarchive'
 compileSdk 35
 defaultConfig { applicationId 'com.multi0819.travelarchive'; minSdk 26; targetSdk 35; versionCode 1; versionName '1.0.0' }
 signingConfigs { travel { storeFile file('../signing/travel.jks'); storePassword 'android'; keyAlias 'travel'; keyPassword 'android' } }
 buildTypes { debug { signingConfig signingConfigs.travel }; release { signingConfig signingConfigs.travel; minifyEnabled false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 kotlinOptions { jvmTarget = '17' }
}
