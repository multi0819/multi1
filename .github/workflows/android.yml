name: Build Travel APK
on:
  push:
    branches: [travel-apk]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore public development key
        run: python3 android/scripts/restore-assets.py
      - name: Test model and export logic
        working-directory: android
        run: node --test scripts/*.test.cjs
      - name: Build release
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TravelArchive-v1.1.0-apk
          path: android/app/build/outputs/apk/release/app-release.apk
